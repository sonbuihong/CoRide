services:
  # PostgreSQL Database
  postgres_db:
    image: postgres:15-alpine
    container_name: coride_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: coride_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d coride_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis_cache:
    image: redis:alpine
    container_name: coride_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: coride_rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: coride_backend
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@postgres_db:5432/coride_db?schema=public
      - REDIS_URL=redis://redis_cache:6379
      - JWT_SECRET=your_jwt_secret_key_here
      - CLOUDINARY_URL=cloudinary://your_key
      - PORT=5002
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: coride_notification_service
    ports:
      - "5003:5003"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - DATABASE_URL=postgresql://root:rootpassword@postgres_db:5432/coride_db?schema=public
      - REDIS_URL=redis://redis_cache:6379
      - PORT=5003
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: coride_api_gateway
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - BACKEND_URL=http://backend:5002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5003
    depends_on:
      - backend
      - notification-service
    restart: unless-stopped

  # Web Frontend Service
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
    container_name: coride_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  postgres_data:


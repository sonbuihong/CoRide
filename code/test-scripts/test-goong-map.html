<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Goong Map - Directions</title>
    
    <!-- Nhúng thư viện MapLibre GL JS và CSS từ CDN -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: sans-serif;
        }
        #map { 
            position: absolute; 
            top: 50px; 
            bottom: 0; 
            width: 100%; 
        }
        #header {
            height: 50px;
            background: #0071e3;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-weight: bold;
        }
        #info {
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="header">
        <span>Test Goong Map & Directions API</span>
        <span id="info">Đang tải tuyến đường...</span>
    </div>
    
    <div id="map"></div>

    <script>
        // API Keys (Từ file .env của dự án)
        const GOONG_MAPS_API_KEY = 'bbgVjDWNA7Yq1C712XTvDLOkDZCioc4Oip4FgDF7'; // Dùng để render Map Tiles
        const GOONG_REST_API_KEY = 'HBO3HIULACZABQUhNY9yM34OFlxYmVKvMnEijabz'; // Dùng cho Directions/Geocoding

        // Hai địa điểm bất kỳ (ví dụ: Hồ Gươm và Đại học Y Hà Nội)
        // Lưu ý: MapLibre dùng format [Kinh độ (lng), Vĩ độ (lat)]
        // Directions API dùng format "Vĩ độ,Kinh độ" (lat,lng)
        const ORIGIN = { name: "Hồ Gươm", lat: 21.028511, lng: 105.854165 };
        const DESTINATION = { name: "Đại học Y Hà Nội", lat: 21.003117, lng: 105.820140 };

        // Khởi tạo bản đồ
        const map = new maplibregl.Map({
            container: 'map',
            style: `https://tiles.goong.io/assets/goong_map_web.json?api_key=${GOONG_MAPS_API_KEY}`,
            center: [ORIGIN.lng, ORIGIN.lat], 
            zoom: 13
        });

        map.addControl(new maplibregl.NavigationControl());

        // Hàm giải mã polyline được trả về từ Goong API
        function decodePolyline(encoded) {
            const points = [];
            let index = 0, lat = 0, lng = 0;
            while (index < encoded.length) {
                let b, shift = 0, result = 0;
                do {
                    b = encoded.charCodeAt(index++) - 63;
                    result |= (b & 0x1f) << shift;
                    shift += 5;
                } while (b >= 0x20);
                const dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lat += dlat;
                
                shift = 0; result = 0;
                do {
                    b = encoded.charCodeAt(index++) - 63;
                    result |= (b & 0x1f) << shift;
                    shift += 5;
                } while (b >= 0x20);
                const dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lng += dlng;
                
                points.push([lng / 1e5, lat / 1e5]); // [lng, lat] cho MapLibre
            }
            return points;
        }

        // Lấy tuyến đường từ Goong REST API
        async function fetchAndDrawRoute() {
            try {
                const originStr = `${ORIGIN.lat},${ORIGIN.lng}`;
                const destStr = `${DESTINATION.lat},${DESTINATION.lng}`;
                
                // Gọi API Directions
                const response = await fetch(
                    `https://rsapi.goong.io/Direction?origin=${originStr}&destination=${destStr}&vehicle=car&api_key=${GOONG_REST_API_KEY}`
                );
                const data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const encodedPolyline = route.overview_polyline.points;
                    
                    // Lấy khoảng cách và thời gian
                    const leg = route.legs[0];
                    document.getElementById('info').innerText = `${leg.distance.text} - Khoảng ${leg.duration.text}`;
                    
                    // Giải mã polyline thành mảng các tọa độ [lng, lat]
                    const coordinates = decodePolyline(encodedPolyline);

                    // Vẽ đường trên map
                    drawRouteOnMap(coordinates);
                    
                    // Zoom bản đồ vừa với cả 2 điểm
                    const bounds = new maplibregl.LngLatBounds();
                    coordinates.forEach(coord => bounds.extend(coord));
                    map.fitBounds(bounds, { padding: 80 });
                } else {
                    document.getElementById('info').innerText = "Không tìm thấy đường đi!";
                }
            } catch (error) {
                console.error("Lỗi khi lấy tuyến đường:", error);
                document.getElementById('info').innerText = "Lỗi khi tải đường đi!";
            }
        }

        function drawRouteOnMap(coordinates) {
            // Thêm nguồn dữ liệu GeoJSON là một đường LineString
            map.addSource('route', {
                'type': 'geojson',
                'data': {
                    'type': 'Feature',
                    'properties': {},
                    'geometry': {
                        'type': 'LineString',
                        'coordinates': coordinates
                    }
                }
            });

            // Thêm Layer hiển thị đường đi (màu xanh nước biển)
            map.addLayer({
                'id': 'route-layer',
                'type': 'line',
                'source': 'route',
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                'paint': {
                    'line-color': '#0071e3', // Màu xanh Apple-like
                    'line-width': 6,
                    'line-opacity': 0.8
                }
            });
        }

        map.on('load', () => {
            console.log('✅ Bản đồ đã tải thành công!');
            
            // Đặt Marker 1: Điểm đi (Màu xanh dương)
            new maplibregl.Marker({ color: "#4285F4" })
                .setLngLat([ORIGIN.lng, ORIGIN.lat])
                .setPopup(new maplibregl.Popup({ offset: 25 }).setText(`Điểm đi: ${ORIGIN.name}`))
                .addTo(map);

            // Đặt Marker 2: Điểm đến (Màu đỏ)
            new maplibregl.Marker({ color: "#EA4335" })
                .setLngLat([DESTINATION.lng, DESTINATION.lat])
                .setPopup(new maplibregl.Popup({ offset: 25 }).setText(`Điểm đến: ${DESTINATION.name}`))
                .addTo(map);

            // Fetch và vẽ đường
            fetchAndDrawRoute();
        });

    </script>
</body>
</html>
